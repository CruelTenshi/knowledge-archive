<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title desc">
<title id="title">현금전환주기 예시</title>
<desc id="desc">0일에 재고를 매입하고 30일에 공급업체에 지급한다. 40일에 상품을 판매하고 65일에 고객에게 대금을 받는다. 지급에서 회수까지 35일이다.</desc>
<rect width="760" height="370" rx="24" fill="#081027"/>
<g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" fill="#eef5ff" text-anchor="middle">
  <text x="380" y="52" font-size="29" font-weight="700">현금전환주기</text>
  <path d="M65 170H722M722 170l-11-6v12z" fill="#8abaff" stroke="#8abaff" stroke-width="2"/>
  <g fill="#081027" stroke="#8abaff" stroke-width="3">
    <circle cx="65" cy="170" r="6"/><circle cx="356" cy="170" r="6"/>
    <circle cx="453" cy="170" r="6"/><circle cx="695" cy="170" r="6"/>
  </g>
  <g font-size="18" font-weight="700">
    <text x="65" y="143">재고 매입</text><text x="356" y="143">대금 지급</text>
    <text x="453" y="143">상품 판매</text><text x="695" y="143">대금 회수</text>
  </g>
  <g font-size="16" fill="#c8d5e9">
    <text x="65" y="200">0일</text><text x="356" y="200">30일</text>
    <text x="453" y="200">40일</text><text x="695" y="200">65일</text>
  </g>
  <path d="M65 112v-10h388v10m0 0v-10h242v10" fill="none" stroke="#56e2d4" stroke-width="2"/>
  <g font-size="18" fill="#56e2d4"><text x="259" y="91">재고 40일</text><text x="574" y="91">채권 25일</text></g>
  <path d="M65 223v10h291v-10" fill="none" stroke="#c4a8fb" stroke-width="2"/>
  <text x="210" y="262" font-size="18" fill="#dccbff">채무 30일</text>
  <path d="M356 275v10h339v-10" fill="none" stroke="#56e2d4" stroke-width="3"/>
  <text x="526" y="321" font-size="23" font-weight="700" fill="#56e2d4">현금 부담 35일</text>
</g>
</svg>
